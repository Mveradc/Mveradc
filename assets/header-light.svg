<rect x="214" y="252" width="22" height="10" rx="2" fill="#0969DA" fill-opacity="0.15"><animate attributeName="fill-opacity" values="0.15;1;0.15" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></rect>
<rect x="244" y="252" width="22" height="10" rx="2" fill="#0969DA" fill-opacity="0.15"><animate attributeName="fill-opacity" values="0.15;1;0.15" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></rect>
<rect x="274" y="252" width="22" height="10" rx="2" fill="#0969DA" fill-opacity="0.15"><animate attributeName="fill-opacity" values="0.15;1;0.15" dur="2.4s" begin="2.1s" repeatCount="indefinite"/></rect>
</g>
