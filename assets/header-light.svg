<rect x="154" y="252" width="22" height="10" rx="2" fill="#0969DA" fill-opacity="0.15"><animate attributeName="fill-opacity" values="0.15;1;0.15" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></rect>
