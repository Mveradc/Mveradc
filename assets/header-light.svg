<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">Miguel Vera</title>
<desc id="d">Data Systems Engineering student at ETSIT-UPM and research assistant at GPDS, working on fairness in U-Space drone traffic. Animated airspace with drones flying along routes and a radar sweep.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D0D7DE" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="0.66" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sweep" cx="960" cy="160" r="150" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0969DA" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#0969DA" stop-opacity="0"/>
  </radialGradient>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#CF222E" stroke-opacity="0.45" stroke-width="2"/>
  </pattern>
  <clipPath id="scene"><rect x="560" y="0" width="640" height="320"/></clipPath>
  <clipPath id="card"><rect width="1200" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="320" fill="#FFFFFF"/>
<rect width="1200" height="320" fill="url(#grid)" opacity="0.5"/>
<g clip-path="url(#scene)">
  <g fill="none" stroke="#D0D7DE" stroke-width="1">
    <circle cx="960" cy="160" r="50"/><circle cx="960" cy="160" r="100"/><circle cx="960" cy="160" r="150"/>
  </g>
  <path d="M960,160 L1110,160 A150,150 0 0,0 1066,54 Z" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="rotate" from="0 960 160" to="360 960 160" dur="7s" repeatCount="indefinite"/>
  </path>
  <polygon points="990,215 1060,200 1088,250 1036,286 984,266" fill="url(#hatch)" stroke="#CF222E" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1000" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#CF222E" fill-opacity="0.8">NO-FLY</text>
  <path id="rA" d="M 640 252 C 760 120, 900 262, 1150 72" fill="none" stroke="#0969DA" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></path>
<path id="rB" d="M 660 58 C 800 140, 960 40, 1150 232" fill="none" stroke="#0969DA" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></path>
<path id="rC" d="M 770 300 C 840 200, 1000 182, 1104 22" fill="none" stroke="#0969DA" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></path>
  <rect x="634" y="246" width="12" height="12" rx="2" fill="none" stroke="#59636E" stroke-width="1.5"/>
<rect x="654" y="52" width="12" height="12" rx="2" fill="none" stroke="#59636E" stroke-width="1.5"/>
<rect x="764" y="294" width="12" height="12" rx="2" fill="none" stroke="#59636E" stroke-width="1.5"/>
<rect x="1144" y="66" width="12" height="12" rx="2" fill="none" stroke="#59636E" stroke-width="1.5"/>
<rect x="1144" y="226" width="12" height="12" rx="2" fill="none" stroke="#59636E" stroke-width="1.5"/>
<rect x="1098" y="16" width="12" height="12" rx="2" fill="none" stroke="#59636E" stroke-width="1.5"/>
  <g><circle r="13" fill="#0969DA" fill-opacity="0.18"/><circle r="4.5" fill="#0969DA"/><animateMotion dur="11s" begin="-0s" repeatCount="indefinite" rotate="auto"><mpath href="#rA"/></animateMotion></g>
<g><circle r="13" fill="#1A7F37" fill-opacity="0.18"/><circle r="4.5" fill="#1A7F37"/><animateMotion dur="14s" begin="-3s" repeatCount="indefinite" rotate="auto"><mpath href="#rB"/></animateMotion></g>
<g><circle r="13" fill="#9A6700" fill-opacity="0.18"/><circle r="4.5" fill="#9A6700"/><animateMotion dur="9s" begin="-1.5s" repeatCount="indefinite" rotate="auto"><mpath href="#rC"/></animateMotion></g>
<g><circle r="13" fill="#0969DA" fill-opacity="0.18"/><circle r="4.5" fill="#0969DA"/><animateMotion dur="11s" begin="-5.5s" repeatCount="indefinite" rotate="auto"><mpath href="#rA"/></animateMotion></g>
</g>
<rect width="1200" height="320" fill="url(#fade)"/>
<text x="64" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#1F2328">Miguel Vera</text>
