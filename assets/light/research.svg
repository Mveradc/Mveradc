<text x="44" y="56" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#0F766E">RESEARCH · GPDS · ETSIT-UPM</text>
<rect x="501" y="34" width="259" height="30" rx="8" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-opacity="0.55"/><text x="631" y="54" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="1" fill="#B45309">FIRST AUTHOR · UNDER REVIEW</text>
<text x="44" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0B1626">Fairness in U-Space flight queues</text>
<text x="44" y="152" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#4D5E77">Drones request airspace through a shared queue. Who gets to fly first</text><text x="44" y="181" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#4D5E77">is a policy choice. I build the simulator and invert it: given the</text><text x="44" y="210" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#4D5E77">fairness profile a regulator wants, infer the queue rules that produce it</text><text x="44" y="239" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#4D5E77">(neural posterior estimation and an MLP-surrogate search loop).</text>
<rect x="44" y="272" width="79" height="30" rx="15" fill="#EEF3F9" stroke="#D5DFEB"/><text x="83" y="292" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#24344D">Python</text><rect x="133" y="272" width="88" height="30" rx="15" fill="#EEF3F9" stroke="#D5DFEB"/><text x="177" y="292" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#24344D">PyTorch</text><rect x="231" y="272" width="106" height="30" rx="15" fill="#EEF3F9" stroke="#D5DFEB"/><text x="284" y="292" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#24344D">sbi · NPE</text><rect x="347" y="272" width="152" height="30" rx="15" fill="#EEF3F9" stroke="#D5DFEB"/><text x="423" y="292" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#24344D">TypeScript sim</text>

