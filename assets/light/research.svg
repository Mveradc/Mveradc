<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Research: fairness in U-Space flight queues — first-author paper under review at SESAR Innovation Days 2026"><title>Research: fairness in U-Space flight queues — first-author paper under review at SESAR Innovation Days 2026</title>
<defs><pattern id="cg" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0F766E" stroke-opacity="0.07" stroke-width="1"/></pattern>
